name: Vialr
options:
  bundleIdPrefix: com.vialr
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  DEFINES_MODULE: YES
  SWIFT_INSTALL_OBJC_HEADER: NO
  CLANG_ENABLE_MODULES: YES

targets:
  Domain:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Domain
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.Domain
      GENERATE_INFOPLIST_FILE: YES

  DesignSystem:
    type: framework
    platform: iOS
    sources:
      - path: Sources/DesignSystem
    dependencies:
      - target: Domain
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.DesignSystem
      GENERATE_INFOPLIST_FILE: YES

  CalculationEngine:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CalculationEngine
    dependencies:
      - target: Domain
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.CalculationEngine
      GENERATE_INFOPLIST_FILE: YES

  Data:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Data
    dependencies:
      - target: Domain
      - target: CalculationEngine
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.Data
      GENERATE_INFOPLIST_FILE: YES

  Health:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Health
    dependencies:
      - target: Domain
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.Health
      GENERATE_INFOPLIST_FILE: YES

  Analytics:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Analytics
    dependencies:
      - target: Domain
      - target: CalculationEngine
      - target: Data
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.Analytics
      GENERATE_INFOPLIST_FILE: YES

  Feature:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Feature
    dependencies:
      - target: DesignSystem
      - target: Domain
      - target: CalculationEngine
      - target: Data
      - target: Health
      - target: Analytics
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.Feature
      GENERATE_INFOPLIST_FILE: YES

  Vialr:
    type: application
    platform: iOS
    sources:
      - path: Sources/VialrApp
    dependencies:
      - target: Feature
      - target: DesignSystem
      - target: Domain
      - target: CalculationEngine
      - target: Data
      - target: Health
      - target: Analytics
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vialr.app
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Vialr
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSHealthShareUsageDescription: "Vialr syncs biomarker, weight, and biometric data to monitor your health outcomes."
      INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Vialr updates your health logs with relevant biometric records."
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
