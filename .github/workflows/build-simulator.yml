name: Build iOS Simulator App for Appetize.io

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build iOS Simulator App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Simulator
        run: |
          xcodebuild build \
            -project Vialr.xcodeproj \
            -scheme Vialr \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Zip .app Bundle for Appetize.io
        run: |
          mkdir -p output
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -X ../../../../output/VialrApp-Simulator.zip Vialr.app
          cd ../../../..
          ls -lh output/VialrApp-Simulator.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VialrApp-Simulator
          path: output/VialrApp-Simulator.zip
          retention-days: 14
