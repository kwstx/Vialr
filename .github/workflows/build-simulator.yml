name: Build iOS Simulator App for Appetize.io

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build iOS Simulator App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.x'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Vialr.xcodeproj \
            -scheme Vialr \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild.log || {
              echo ""
              echo "========================================================"
              echo "  COMPILATION ERRORS OCCURRED:                          "
              echo "========================================================"
              grep -E "error:" xcodebuild.log || tail -n 50 xcodebuild.log
              echo "========================================================"
              exit 1
            }

      - name: Zip .app Bundle for Appetize.io
        run: |
          mkdir -p output
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -X ../../../../output/VialrApp-Simulator.zip Vialr.app
          cd ../../../..
          ls -lh output/VialrApp-Simulator.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VialrApp-Simulator
          path: output/VialrApp-Simulator.zip
          retention-days: 14
